<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alvia – Coming Soon</title>
  <meta name="description" content="Alvia – bald verfügbar.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
      background: #0b0b0f;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    .logo {
      width: 100%;
      max-width: 420px;
      height: auto;
      display: block;
      opacity: 0;
      animation: fadeUp 1.2s ease-out forwards, float 4s ease-in-out 1.2s infinite;
    }

    h1 {
      font-size: clamp(1.2rem, 4vw, 2rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      opacity: 0;
      animation: fadeUp 1.2s ease-out 0.5s forwards, pulse 2.5s ease-in-out 1.7s infinite;
    }

    /* Sanftes Einblenden von unten */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Leichtes Schweben des Logos */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    /* Pulsierender Text */
    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50%      { opacity: 1; }
    }

    /* Nutzer, die Animationen reduzieren wollen */
    @media (prefers-reduced-motion: reduce) {
      .logo, h1 {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <img src="Alvia_Logo.png" alt="Alvia Logo" class="logo" width="1672" height="941">
  <h1>Alvia Webpage is coming soon</h1>
</body>
</html>
